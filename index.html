<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="/manifest.json">
<title>TermuxFLAC</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">Termux<span>FLAC</span></div>
  <button id="scanBtn" class="icon" title="Scan library">↻</button>
</header>

<main>
  <section class="now">
    <img id="cover" src="/api/art/default" alt="Album art">
    <div class="meta">
      <h1 id="title">Nothing playing</h1>
      <p id="artist">Choose a track</p>
      <p id="album"></p>
    </div>
    <input id="progress" type="range" min="0" max="100" value="0">
    <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
    <div class="controls">
      <button id="shuffle" class="control">🔀</button>
      <button id="prev" class="control big">⏮</button>
      <button id="play" class="play">▶</button>
      <button id="next" class="control big">⏭</button>
      <button id="repeat" class="control">🔁</button>
    </div>
  </section>

  <section class="library">
    <div class="tabs"><button class="tab active" data-tab="queue">Queue</button><button class="tab" data-tab="library">Library</button></div>
    <div class="search"><input id="search" placeholder="Search songs, artists, albums…"></div>
    <div id="list"></div>
  </section>
</main>

<audio id="audio" preload="metadata"></audio>
<script src="/app.js"></script>
</body>
</html>
